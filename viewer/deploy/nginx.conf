# Static host for the VR viewer. It sits behind the reverse proxy that already
# fronts Immich, which routes /vr/* here and strips the /vr prefix — so
# everything here is served from the root. See proxy/ for examples.
server {
    listen 8088;
    server_name _;
    root /srv/vr;
    index index.html;

    # The probe is iterated on constantly and is tiny. Caching it only hides
    # changes behind a headset reboot.
    add_header Cache-Control "no-store" always;

    # Diagnostics posted by the headset. There are no usable devtools in there,
    # so this is the only way the results come back.
    location = /log {
        proxy_pass http://collector:9000/log;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512k;
    }

    # Traefik strips the /vr prefix, so this arrives as /sw.js — but the browser
    # sees it at /vr/sw.js, and a worker's default maximum scope is its own
    # directory. The user can land on /vr without a trailing slash, which is NOT
    # inside scope /vr/, so Immich's "/" worker would keep control of exactly the
    # page we need it out of. This header widens the allowed scope to /vr.
    location = /sw.js {
        add_header Service-Worker-Allowed "/vr" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
