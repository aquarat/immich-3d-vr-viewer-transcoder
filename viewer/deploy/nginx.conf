# Static host for the VR viewer. It sits behind the reverse proxy that already
# fronts Immich, which routes /vr/* here and strips the /vr prefix — so
# everything here is served from the root. See proxy/ for examples.

# Immich itself, asked whether a diagnostics report comes from someone logged
# in. The default reaches an Immich published on this host's port 2283 — the
# official compose file's arrangement — through the host-gateway alias set in
# docker-compose.yml. If Immich is elsewhere, change this line.
upstream immich {
    server host.docker.internal:2283;
}

server {
    listen 8088;
    server_name _;
    root /srv/vr;
    index index.html;

    # The probe is iterated on constantly and is tiny. Caching it only hides
    # changes behind a headset reboot.
    add_header Cache-Control "no-store" always;

    # Diagnostics posted by the headset. There are no usable devtools in there,
    # so this is the only way the results come back.
    #
    # Only from someone logged in to Immich: anything that can reach /vr/ could
    # otherwise write to this disk, and many Immich servers face the internet.
    location = /log {
        auth_request /_immich_auth;
        proxy_pass http://collector:9000/log;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 512k;
    }

    # Hands Immich the report's own credentials — the session cookie the page
    # sends, or an x-api-key header — and asks who they belong to. A 2xx lets
    # the report through, a 401 or 403 turns it away, and an Immich that cannot
    # be reached fails closed.
    location = /_immich_auth {
        internal;
        proxy_method GET;
        proxy_pass http://immich/api/users/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # The proxy strips the /vr prefix, so this arrives as /sw.js — but the
    # browser sees it at /vr/sw.js, and a worker's default maximum scope is its
    # own directory. The page can be loaded as /vr without a trailing slash,
    # which is NOT inside scope /vr/, so Immich's "/" worker would keep control
    # of exactly the page it has to be kept out of. This widens the allowed
    # scope to /vr.
    location = /sw.js {
        add_header Service-Worker-Allowed "/vr" always;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
