# nginx: serve the viewer at /vr on the same origin as Immich.
#
# Add these locations to the server block that already proxies Immich. Same
# origin means the Immich session cookie authenticates the viewer's requests and
# no CORS headers are needed (Immich sends none).

# The trailing slash on proxy_pass strips the /vr/ prefix.
location /vr/ {
    proxy_pass http://127.0.0.1:8088/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# /vr without the slash: send it to the canonical address.
location = /vr {
    return 301 /vr/;
}
