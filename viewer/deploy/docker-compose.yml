# The viewer's static files plus a small diagnostics collector.
#
# Your reverse proxy must route https://<your-immich-host>/vr/* to port 8088 here,
# stripping the /vr prefix, so the viewer is same-origin with Immich (see proxy/).
# If the proxy runs on this machine, bind to loopback instead:  '127.0.0.1:8088:8088'
#
#   docker compose up -d
#
# nginx reads nginx.conf at start-up only: after editing it, run
#   docker compose exec vr-static nginx -s reload
services:
  vr-static:
    image: nginx:1.27-alpine
    container_name: immich-vr-static
    restart: unless-stopped
    # Lets nginx reach Immich on this host's port 2283, to check that a
    # diagnostics report comes from someone logged in (see nginx.conf).
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - '8088:8088'
    volumes:
      - ../public:/srv/vr:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - collector

  # Diagnostic sink. Not published on the host: only nginx talks to it, over the
  # compose network, at /vr/log.
  collector:
    image: python:3.12-alpine
    container_name: immich-vr-collector
    restart: unless-stopped
    command: ['python', '/app/collector.py']
    environment:
      - LOG_DIR=/logs
    volumes:
      - ./collector.py:/app/collector.py:ro
      - ./logs:/logs
